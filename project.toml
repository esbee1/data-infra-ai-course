# =============================================================================
#  project.toml · YOUR PROJECT SETTINGS
#  This is the only file you edit. pipeline.py reads it and does the rest.
#
#  Rules of the format:
#   - Text goes in "double quotes". Lists go in [square brackets].
#   - Lines starting with # are notes for people; the computer ignores them.
#   - SQL that spans several lines goes between triple quotes: """ ... """
#
#  This example: NYC 311 heat and hot water complaints from the last 7 days.
#  To see any API's columns before filling this in, run:  python pipeline.py --preview
# =============================================================================

[project]
name = "heat_complaints"        # a short name: lowercase, no spaces


# -----------------------------------------------------------------------------
# 1. SOURCE: where the data comes from
# -----------------------------------------------------------------------------
[source]
type = "socrata"                # "socrata" for NYC Open Data and most city portals,
                                # "worldbank" for the World Bank (see examples/)

# The API address: on the dataset's page, click Export (or API) and copy the
# "API Endpoint" ending in .json
url = "https://data.cityofnewyork.us/resource/erm2-nwe9.json"

# The columns to keep (use the names that --preview shows you)
columns = ["unique_key", "created_date", "complaint_type", "borough", "incident_zip"]

# Optional: only some rows. Leave as "" to take everything.
filter = "complaint_type = 'HEAT/HOT WATER'"

# Optional: only recent rows. Remove these two lines to take all dates.
date_column = "created_date"
days_back = 7

max_rows = 20000                # a safety limit on how many rows to fetch


# -----------------------------------------------------------------------------
# 2. CHECKS: the rules that define "ready" (at least five)
#    The data arrives in a table called raw.
#    Each check is SQL that COUNTS PROBLEM ROWS. 0 problems = PASS.
#    If any check fails, the run stops and nothing is published.
# -----------------------------------------------------------------------------
[[checks]]
name = "enough rows arrived"
why  = "a near-empty download means something went wrong at the source"
sql  = "SELECT CASE WHEN count(*) >= 100 THEN 0 ELSE 1 END FROM raw"

[[checks]]
name = "unique_key is never missing or repeated"
why  = "each complaint must be counted exactly once"
sql  = "SELECT count(*) - count(DISTINCT unique_key) FROM raw"

[[checks]]
name = "borough is one of the five (or UNSPECIFIED)"
why  = "a misspelled borough would split one borough's totals in two"
sql  = """
SELECT count(*) FROM raw
WHERE borough NOT IN ('BRONX', 'BROOKLYN', 'MANHATTAN', 'QUEENS', 'STATEN ISLAND', 'UNSPECIFIED')
"""

[[checks]]
name = "no complaints dated in the future"
why  = "a future date means a data entry error"
sql  = "SELECT count(*) FROM raw WHERE created_date > now()::TIMESTAMP + INTERVAL 1 DAY"

[[checks]]
name = "fresh: newest complaint is under 3 days old"
why  = "if the city stops updating, we should notice, not publish stale data"
sql  = "SELECT CASE WHEN max(created_date) >= now()::TIMESTAMP - INTERVAL 3 DAY THEN 0 ELSE 1 END FROM raw"


# -----------------------------------------------------------------------------
# 3. TABLES: what to build and publish to MotherDuck (at least one)
#    Each is a SELECT on raw (or on a table listed above it).
# -----------------------------------------------------------------------------
[[tables]]
name = "heat_complaints"
sql  = """
SELECT unique_key, created_date, created_date::DATE AS created_day, borough, incident_zip
FROM raw
WHERE borough <> 'UNSPECIFIED'      -- can't be placed in a borough: dropped on purpose
"""

[[tables]]
name = "heat_by_borough_day"
sql  = """
SELECT borough, created_day, count(*) AS complaints
FROM heat_complaints
GROUP BY borough, created_day
"""
